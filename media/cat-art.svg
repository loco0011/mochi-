<svg class="cat" id="cat" viewBox="0 0 240 250" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <radialGradient id="fur-head" cx="50%" cy="40%" r="62%">
      <stop offset="0" style="stop-color:var(--fur)"/>
      <stop offset=".7" style="stop-color:var(--fur)"/>
      <stop offset="1" style="stop-color:var(--fur-dark)"/>
    </radialGradient>
    <radialGradient id="fur-body" cx="50%" cy="30%" r="75%">
      <stop offset="0" style="stop-color:var(--fur)"/>
      <stop offset=".65" style="stop-color:var(--fur)"/>
      <stop offset="1" style="stop-color:var(--fur-dark)"/>
    </radialGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="65%">
      <stop offset="0" style="stop-color:var(--iris)"/>
      <stop offset="1" style="stop-color:var(--iris-dark)"/>
    </radialGradient>
  </defs>

  <!-- shadow on the ground -->
  <ellipse cx="124" cy="240" rx="68" ry="5" fill="#000" opacity=".16"/>

  <!-- tail: curls up behind on the right, with tabby rings -->
  <g class="tail">
    <path d="M156 230 C194 236 214 214 207 184 C202 164 210 148 222 140" stroke="var(--fur-dark)" stroke-width="17"/>
    <path d="M156 230 C194 236 214 214 207 184 C202 164 210 148 222 140" stroke="var(--fur)" stroke-width="14"/>
    <path d="M156 230 C194 236 214 214 207 184 C202 164 210 148 222 140" stroke="var(--fur-dark)" stroke-width="14" stroke-dasharray="6 12" stroke-dashoffset="-14" stroke-linecap="butt" opacity=".8"/>
  </g>

  <!-- body: narrow shoulders, wide haunches -->
  <path d="M120 116 C96 116 86 134 82 156 C78 176 66 196 66 216 C66 232 78 238 92 238 L148 238 C162 238 174 232 174 216 C174 196 162 176 158 156 C154 134 144 116 120 116 Z" fill="url(#fur-body)"/>
  <!-- side stripes + haunch contours -->
  <g stroke="var(--fur-dark)" stroke-width="4" opacity=".75">
    <path d="M86 156 C91 155 95 159 97 166 M81 174 C87 172 93 177 95 186 M74 194 C80 192 86 196 88 204"/>
    <path d="M154 156 C149 155 145 159 143 166 M159 174 C153 172 147 177 145 186 M166 194 C160 192 154 196 152 204"/>
  </g>
  <g stroke="var(--fur-dark)" stroke-width="2" opacity=".55">
    <path d="M76 222 C78 202 92 192 102 202"/>
    <path d="M164 222 C162 202 148 192 138 202"/>
  </g>
  <!-- chest bib -->
  <path d="M120 124 C106 126 100 146 102 168 C104 186 112 196 120 196 C128 196 136 186 138 168 C140 146 134 126 120 124 Z" fill="var(--cream)" opacity=".92"/>

  <!-- front legs with white socks -->
  <g stroke="var(--fur-dark)" stroke-width="1.2">
    <path d="M104 172 C102 194 102 216 103 234 L117 234 C117 216 117 194 116 174 Z" fill="var(--fur)"/>
    <path d="M136 172 C138 194 138 216 137 234 L123 234 C123 216 123 194 124 174 Z" fill="var(--fur)"/>
  </g>
  <g stroke="var(--fur-dark)" stroke-width="2.5" opacity=".7">
    <path d="M104 196 h12 M104 208 h13"/>
    <path d="M136 196 h-12 M136 208 h-13"/>
  </g>
  <g fill="var(--cream)">
    <path d="M102 222 C102 218 118 218 118 222 L118 234 C118 238 101 239 100 234 Z"/>
    <path d="M138 222 C138 218 122 218 122 222 L122 234 C122 238 139 239 140 234 Z"/>
  </g>
  <path d="M105 233 v4 M110 233 v5 M115 233 v4 M125 233 v4 M130 233 v5 M135 233 v4" stroke="var(--line)" stroke-width="1" opacity=".35"/>

  <!-- what the cat has with it (a glass, glasses, a ball of yarn...) -->
  <text id="prop" x="38" y="238" font-size="34" text-anchor="middle" fill="#000"></text>

  <!-- head -->
  <g class="head">
    <!-- ears, with pink insides and fur tufts -->
    <g class="ear-l">
      <path d="M78 84 C74 62 76 42 82 28 C94 36 106 46 112 58 Z" fill="var(--fur)" stroke="var(--fur-dark)" stroke-width="1.2"/>
      <path d="M85 72 C83 58 84 46 87 39 C94 44 100 51 104 59 Z" fill="var(--pink)" opacity=".7"/>
      <path d="M88 64 l7 -5 M89 70 l8 -3 M91 58 l5 -5" stroke="var(--cream)" stroke-width="1.2"/>
    </g>
    <g class="ear-r">
      <path d="M162 84 C166 62 164 42 158 28 C146 36 134 46 128 58 Z" fill="var(--fur)" stroke="var(--fur-dark)" stroke-width="1.2"/>
      <path d="M155 72 C157 58 156 46 153 39 C146 44 140 51 136 59 Z" fill="var(--pink)" opacity=".7"/>
      <path d="M152 64 l-7 -5 M151 70 l-8 -3 M149 58 l-5 -5" stroke="var(--cream)" stroke-width="1.2"/>
    </g>

    <!-- skull + cheek fluff -->
    <path d="M120 50 C146 50 164 64 168 86 C170 98 168 108 162 116 L172 114 L163 121 L169 125 L156 127 C146 132 133 134 120 134 C107 134 94 132 84 127 L71 125 L77 121 L68 114 L78 116 C72 108 70 98 72 86 C76 64 94 50 120 50 Z" fill="url(#fur-head)"/>

    <!-- tabby "M" on the forehead and cheek stripes -->
    <g stroke="var(--fur-dark)" stroke-width="3.2">
      <path d="M108 60 L112 73 M120 55 V71 M132 60 L128 73"/>
      <path d="M97 63 Q101 68 102 74 M143 63 Q139 68 138 74" stroke-width="2.4" opacity=".8"/>
      <path d="M74 98 Q82 98 89 102 M76 107 Q83 107 89 110" stroke-width="2.6" opacity=".85"/>
      <path d="M166 98 Q158 98 151 102 M164 107 Q157 107 151 110" stroke-width="2.6" opacity=".85"/>
    </g>

    <!-- muzzle -->
    <path d="M120 99 C109 99 101 105 101 114 C101 123 110 127 120 127 C130 127 139 123 139 114 C139 105 131 99 120 99 Z" fill="var(--cream)"/>

    <!-- eyes: open almond eyes with slit pupils -->
    <g class="eyes-open">
      <g class="eye">
        <path d="M86 92 Q100 72 116 87 Q106 103 86 92 Z" fill="url(#iris)" stroke="var(--line)" stroke-width="2"/>
        <ellipse cx="101.5" cy="89" rx="2.6" ry="6.2" fill="var(--eye)"/>
        <circle cx="97" cy="84.5" r="1.9" fill="#fff"/>
      </g>
      <g class="eye">
        <path d="M154 92 Q140 72 124 87 Q134 103 154 92 Z" fill="url(#iris)" stroke="var(--line)" stroke-width="2"/>
        <ellipse cx="138.5" cy="89" rx="2.6" ry="6.2" fill="var(--eye)"/>
        <circle cx="134" cy="84.5" r="1.9" fill="#fff"/>
      </g>
    </g>
    <!-- happy: a contented slow blink -->
    <g class="eyes-happy" stroke="var(--line)" stroke-width="2.4">
      <path d="M88 92 Q101 85 115 89"/>
      <path d="M152 92 Q139 85 125 89"/>
    </g>
    <!-- sleepy: closed lids -->
    <g class="eyes-sleepy" stroke="var(--line)" stroke-width="2.4">
      <path d="M88 90 Q101 97 115 89"/>
      <path d="M152 90 Q139 97 125 89"/>
    </g>
    <!-- grumpy: furrowed brow -->
    <g class="brows" stroke="var(--line)" stroke-width="2.6">
      <path d="M88 80 L110 86"/>
      <path d="M152 80 L130 86"/>
    </g>

    <!-- the faintest blush -->
    <g class="blush" fill="#ff8fa8" opacity=".2">
      <ellipse cx="91" cy="112" rx="7" ry="4"/>
      <ellipse cx="149" cy="112" rx="7" ry="4"/>
    </g>

    <!-- nose + mouth -->
    <path d="M114 104 Q120 101.5 126 104 Q124.5 108.5 120 111 Q115.5 108.5 114 104 Z" fill="var(--nose)" stroke="var(--line)" stroke-width=".8"/>
    <path class="mouth-w" d="M120 111 V115 M120 115 Q116 120 111 117 M120 115 Q124 120 129 117" stroke="var(--line)" stroke-width="1.6"/>
    <path class="mouth-grumpy" d="M120 111 V115 M111 121 Q120 115 129 121" stroke="var(--line)" stroke-width="1.6"/>

    <!-- whisker pads + whiskers -->
    <g fill="var(--line)" opacity=".45">
      <circle cx="109" cy="113" r=".9"/><circle cx="105" cy="116" r=".9"/><circle cx="110" cy="118" r=".9"/>
      <circle cx="131" cy="113" r=".9"/><circle cx="135" cy="116" r=".9"/><circle cx="130" cy="118" r=".9"/>
    </g>
    <g stroke="var(--line)" stroke-width=".9" opacity=".5">
      <path d="M104 114 Q84 109 60 107 M104 117 Q83 117 58 121 M105 120 Q86 125 64 132"/>
      <path d="M136 114 Q156 109 180 107 M136 117 Q157 117 182 121 M135 120 Q154 125 176 132"/>
    </g>
  </g>
</svg>
